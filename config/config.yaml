# AutoCRM — فایل تنظیمات مرکزی

# ─────────────────────────────────────────────
# RFM
# ─────────────────────────────────────────────
# ─────────────────────────────────────────────
# سگمنت‌بندی رفتاری (سه‌گانه: تازگی، بسامد، مالی)
# ─────────────────────────────────────────────
# هر بُعد یک نمره ۰ تا ۵ می‌گیرد؛ بعد با آستانه‌های «band_thresholds» به باند
# کم/متوسط/زیاد تبدیل می‌شود و ترکیب سه باند، سگمنت نهایی را می‌سازد
# (قوانین سگمنت‌ها در فایل segmentation.py است).
#
# دو روش نمره‌دهی در این بخش استفاده شده:
#   روش پله‌ای (فقط تازگی): مرزهای مطلق روزها — چون «۳۰ روز بی‌فعالیتی»
#     معنای مطلق دارد و نباید به توزیع جمعیت وابسته باشد.
#   روش صدکی (بسامد و مالی): صدکِ درصدِ مشخص‌شده فقط بین کاربرانِ دارای
#     فعالیت/پرداخت محاسبه می‌شود؛ آن نقطه نمره ۵ می‌گیرد و بالاتر از آن
#     (پرت‌ها) هم همان ۵ — تا مقیاس نمره به کاربران غول‌آسا گره نخورد.
#
# بسامد و مالی هر دو «ترکیب وزنی» دارند: وزن پنجره اخیر + وزن کل عمر
# (جمع دو وزن = ۱). پنجره‌های این دو مستقل‌اند و عمداً متفاوت‌اند:
# پرداخت کم‌تکرارتر از آپلود است، پس پنجره مالی بلندتر گرفته شده.
rfm:
  user_window:
    new_user_days: 30        # ثبت‌نام جدیدتر از این = «تازه‌وارد»
    consideration_days: 365  # قدمت ملاک تفکیک تازه‌وارد از بدون‌فعالیت

  recency:                   # تازگی — روش پله‌ای (بدون صدک)
    ladder_days: [30, 90]   # تا ۳۰ روز = تازه، ۳۱ تا ۹۰ = ولرم، بیش از ۹۰ = سرد
    scores:                  # نمره هر برچسب
      fresh: 5
      warm: 3
      cold: 1
      new: 3
      never_active: 0
    band_thresholds: { high: 3.5, medium: 2.0 }   # باند تازگی — ستون نمایشی خروجی

  frequency:                 # بسامد آپلود — روش صدکی
    percentile: 90          # درصد صدک مبنا (فقط بین کاربران دارای آپلود)
    window_days: 60         # پنجره اخیر — عمداً کوتاه‌تر از مالی
    window_weight: 0.6      # سهم پنجره اخیر در نمره
    lifetime_weight: 0.4    # سهم کل عمر در نمره
    band_thresholds: { high: 3.5, medium: 2.0 }

  monetary:                  # مالی — روش صدکی (فقط پرداخت‌کننده‌های واقعی)
    percentile: 90          # درصد صدک مبنا
    window_days: 90         # پنجره اخیر — عمداً بلندتر از بسامد
    window_weight: 0.6      # سهم پنجره اخیر در نمره
    lifetime_weight: 0.4    # سهم کل عمر در نمره
    band_thresholds: { high: 4, medium: 2 }

# ─────────────────────────────────────────────
# Health Score — همه وزن‌ها و بازه‌ها از ۱۰۰ نرمالایز
# هر شاخص ۰ تا ۱۰۰ است، بعد وزن می‌گیرد
# ─────────────────────────────────────────────
health_score:
  weights: { severity: 55, count: 20, demographics: 25 }  # جمع ۱۰۰ — قابل تغییر
  weight_source: "AI-generated — needs physician sign-off"
  signoff: { reviewer: "", date: "", status: "pending" }
  severity:
    max_finding_score: 9.9
    # نمره پایه هر یافته از روی status آن — ۳=غیرعادی واضح، ۲=کم‌اهمیت، ۱=مرزی
    # (فارسی و انگلیسی؛ مقادیر ناموجود در این جدول → پیش‌فرض در کد: مرزی=۱ / غیرعادی=۲)
    status_scores:
      "بالا": 3
      "high": 3
      "پایین": 2
      "low": 2
      "positive": 2
      "در آستانه بالا": 1
      "در آستانه پایین": 1
    dist_mult: [[0,10,1.0],[10,25,1.2],[25,50,1.5],[50,100,1.8],[100,200,2.0],[200,999999999,2.2]]
  demographics:
    # هر کدام ۰ تا ۱۰۰ — بعد میانگین می‌شوند و وزن demographics می‌گیرند
    age:
      brackets:
        - up_to: 30
          score: 0
        - up_to: 45
          score: 25
        - up_to: 60
          score: 66
        - up_to: 200
          score: 100
    bmi:
      brackets:
        - up_to: 18.5
          score: 40
        - up_to: 25
          score: 0
        - up_to: 30
          score: 33
        - up_to: 100
          score: 66

# ─────────────────────────────────────────────
# Health Trend — ۵ نقطه، بدون روز در اسم، وزن مجزا
# هر شاخص اینجا هم ۰ تا ۱۰۰ و وزن مجزا — مخرج ۷۵ حذف شد
# ─────────────────────────────────────────────
health_trend:
  enabled: true
  weights: { severity: 73, count: 27 }  # جمع ۱۰۰ — نسبت ۵۵:۲۰ نرمالایز به ۱۰۰
  stable_band: 5
  slope_points: 3
  # ✅ min_slope_span_days: (استفاده می‌شود) حداقل فاصله روزی بین نقاط شیب؛
  min_slope_span_days: 7
  min_points: 2
  column_names: { slope: "health_slope_3pt" }
  points:
    - name: "point1"
      max_days: 7
      enabled: false
      column: "health_delta_point1"
    - name: "point2"
      max_days: 14
      enabled: false
      column: "health_delta_point2"
    - name: "point3"
      max_days: 30
      enabled: true
      column: "health_delta_point3"
    - name: "point4"
      max_days: 60
      enabled: true
      column: "health_delta_point4"
    - name: "point5"
      max_days: 90
      enabled: false
      column: "health_delta_point5"
